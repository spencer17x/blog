name: Assemble original harness images

on:
  push:
    branches:
      - agent/fix-harness-original-images
    paths:
      - .image-parts/READY

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact original images and update article
        shell: bash
        env:
          URL_4132: "https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-cf48-81fd-b161-aeb217e540db/raw?se=2026-07-20T17%3A09%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=b793ec5f-c0c1-48cf-9e40-c9db23de5927&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-20T00%3A03%3A59Z&ske=2026-07-22T00%3A03%3A59Z&sks=b&skv=2026-02-06&sig=B%2BsO020OQMsvcJkH2zkGvk3ymkA0G6PVNzIt%2BWFAzUI%3D"
          URL_4133: "https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-3b50-8206-98bb-d66793fac44e/raw?se=2026-07-20T17%3A09%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=b793ec5f-c0c1-48cf-9e40-c9db23de5927&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-20T00%3A02%3A58Z&ske=2026-07-22T00%3A02%3A58Z&sks=b&skv=2026-02-06&sig=Lnaht4hsTfIdHo/dvdMxg5Naa13/TbMsnTG%2BhfqHfAg%3D"
          URL_4134: "https://oaisdmntprjapaneast.blob.core.windows.net/files/00000000-0c58-8209-ac8d-e252c9681286/raw?se=2026-07-20T17%3A10%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=b793ec5f-c0c1-48cf-9e40-c9db23de5927&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-19T23%3A11%3A56Z&ske=2026-07-21T23%3A11%3A56Z&sks=b&skv=2026-02-06&sig=PL90LAj2W6RBxx5j5tccUFYnR/Iv7blKCrRPAERQ1Bc%3D"
          URL_4135: "https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-61d0-8206-9798-a38646a931dc/raw?se=2026-07-20T17%3A10%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=b793ec5f-c0c1-48cf-9e40-c9db23de5927&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-19T23%3A04%3A58Z&ske=2026-07-21T23%3A04%3A58Z&sks=b&skv=2026-02-06&sig=ZSDRzcYd9%2B/U8bgtBJIxL4d7ZrV5p%2B8LYMUOtEHvYIs%3D"
        run: |
          set -euo pipefail

          out_dir="source/articleImgs/harness-agent-loop"
          mkdir -p "$out_dir"

          curl --fail --location --retry 3 "$URL_4132" --output "$out_dir/1000014132.jpg"
          curl --fail --location --retry 3 "$URL_4133" --output "$out_dir/1000014133.jpg"
          curl --fail --location --retry 3 "$URL_4134" --output "$out_dir/1000014134.jpg"
          curl --fail --location --retry 3 "$URL_4135" --output "$out_dir/1000014135.jpg"

          sha256sum --check <<'CHECKSUMS'
          ad5b8dcd501673dbf814162d1a99eb26fa5ca93b3d3cba0c1b2ffe73729375b1  source/articleImgs/harness-agent-loop/1000014132.jpg
          48ff3a728f4186f62287974940b540af9e4e9731fc0f20199bef048245f8920e  source/articleImgs/harness-agent-loop/1000014133.jpg
          4423adb059d88880706c14c9c8d89cfdbab932548f26492eb3b492c059aff653  source/articleImgs/harness-agent-loop/1000014134.jpg
          d507aa3b7974f64ab1414ef3b6d56d7edae90eb34e5aebfc5e0e74b30d30dd86  source/articleImgs/harness-agent-loop/1000014135.jpg
          CHECKSUMS

          python <<'PY'
          from pathlib import Path

          article = Path('source/_posts/Harness-Agent-Loop-与项目级-Harness.md')
          text = article.read_text(encoding='utf-8')
          replacements = {
              '/articleImgs/harness-agent-loop/overview.webp': '/articleImgs/harness-agent-loop/1000014132.jpg',
              '/articleImgs/harness-agent-loop/agent-loop.webp': '/articleImgs/harness-agent-loop/1000014133.jpg',
              '/articleImgs/harness-agent-loop/harness-layers.webp': '/articleImgs/harness-agent-loop/1000014134.jpg',
              '/articleImgs/harness-agent-loop/harness.webp': '/articleImgs/harness-agent-loop/1000014135.jpg',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected article reference: {old}')
              text = text.replace(old, new)
          article.write_text(text, encoding='utf-8')
          PY

          rm -f \
            "$out_dir/overview.webp" \
            "$out_dir/agent-loop.webp" \
            "$out_dir/harness.webp" \
            "$out_dir/harness-layers.webp" \
            "$out_dir/agent-loop.svg" \
            "$out_dir/harness.svg"
          rm -rf "source/images/harness-agent-loop"
          rm -rf "source/articleImgs/Harness-Agent-Loop-与项目级-Harness"
          rm -rf .image-parts
          rm -f .github/workflows/assemble-harness-images.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use original harness article images"
          git push
